<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TaCoS demo resume card preview</title>
  <desc id="desc">Illustrative sample of the TaCoS resume brief card stack with Now, Next, Blocked, and Restore sections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)" />
  <rect x="70" y="54" width="1060" height="612" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2" />
  <rect x="98" y="90" width="1004" height="72" rx="10" fill="#1f2937" />
  <text x="126" y="135" fill="#f8fafc" font-family="Menlo,Consolas,monospace" font-size="30">TaCoS Resume Brief (Sample)</text>
  <text x="778" y="135" fill="#fbbf24" font-family="Menlo,Consolas,monospace" font-size="20">Demo data only</text>

  <rect x="98" y="188" width="490" height="196" rx="12" fill="#111827" stroke="#334155" />
  <text x="122" y="224" fill="#93c5fd" font-family="Menlo,Consolas,monospace" font-size="22">Now</text>
  <text x="122" y="256" fill="#f8fafc" font-family="Menlo,Consolas,monospace" font-size="18">Stabilize resume flow after interruption</text>
  <text x="122" y="292" fill="#94a3b8" font-family="Menlo,Consolas,monospace" font-size="16">Last action: edited summary/render helper</text>

  <rect x="612" y="188" width="490" height="196" rx="12" fill="#111827" stroke="#334155" />
  <text x="636" y="224" fill="#86efac" font-family="Menlo,Consolas,monospace" font-size="22">Next</text>
  <text x="636" y="256" fill="#f8fafc" font-family="Menlo,Consolas,monospace" font-size="18">1. Open entry file and confirm context</text>
  <text x="636" y="286" fill="#f8fafc" font-family="Menlo,Consolas,monospace" font-size="18">2. Run smallest safe verification</text>
  <text x="636" y="316" fill="#f8fafc" font-family="Menlo,Consolas,monospace" font-size="18">3. Capture checkpoint for future-you</text>

  <rect x="98" y="410" width="490" height="212" rx="12" fill="#111827" stroke="#334155" />
  <text x="122" y="446" fill="#fca5a5" font-family="Menlo,Consolas,monospace" font-size="22">Blocked</text>
  <text x="122" y="478" fill="#f8fafc" font-family="Menlo,Consolas,monospace" font-size="18">No active blocker in sample mode</text>
  <rect x="122" y="500" width="206" height="40" rx="8" fill="#374151" />
  <text x="142" y="527" fill="#e2e8f0" font-family="Menlo,Consolas,monospace" font-size="16">Dismiss sample</text>

  <rect x="612" y="410" width="490" height="212" rx="12" fill="#111827" stroke="#334155" />
  <text x="636" y="446" fill="#fde68a" font-family="Menlo,Consolas,monospace" font-size="22">Restore</text>
  <text x="636" y="478" fill="#94a3b8" font-family="Menlo,Consolas,monospace" font-size="16">Sample mode keeps restore actions disabled until</text>
  <text x="636" y="506" fill="#94a3b8" font-family="Menlo,Consolas,monospace" font-size="16">you switch to live workspace context.</text>
  <rect x="636" y="530" width="268" height="40" rx="8" fill="#1d4ed8" />
  <text x="658" y="557" fill="#f8fafc" font-family="Menlo,Consolas,monospace" font-size="16">Show real resume now</text>
</svg>
