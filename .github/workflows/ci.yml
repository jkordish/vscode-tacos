name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates (format, lint, typecheck, unit)
        run: npm run verify:quick

      - name: Integration test
        run: xvfb-run -a npm run test:integration

      - name: Package smoke test
        run: npx @vscode/vsce package --no-dependencies --out vscode-tacos-ci.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-tacos-vsix
          path: vscode-tacos-ci.vsix
