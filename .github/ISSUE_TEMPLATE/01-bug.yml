name: Bug report
description: Report a reproducible defect in TaCoS behavior.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please include sanitized diagnostics from `TaCoS: Copy Diagnostics`.
        Do not post secrets, API keys, private local paths, or raw sensitive command history.
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs actual behavior
      placeholder: Expected ... but observed ...
    validations:
      required: true
  - type: checkboxes
    id: flow_area
    attributes:
      label: Where did this happen?
      options:
        - label: Auto summary (focus/idle)
        - label: Manual summary command
        - label: Restore working set flow
        - label: Standup generation
        - label: Codex handoff (`copyPromptAndOpenCodex`)
        - label: Checkpoint/scratchpad flow
        - label: Provider refinement flow
        - label: Other UI/command surface
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: vscode_version
    attributes:
      label: VS Code version
      placeholder: e.g. 1.99.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. macOS 15.3 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: dropdown
    id: workspace_context
    attributes:
      label: Workspace context
      options:
        - Local filesystem workspace
        - Remote SSH workspace
        - Dev Container workspace
        - WSL workspace
        - Codespaces workspace
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: trust_mode
    attributes:
      label: Workspace trust mode
      options:
        - trusted
        - restricted
        - not sure
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Summary provider
      options:
        - local
        - vscode-lm
        - openai
        - not sure
    validations:
      required: true
  - type: dropdown
    id: privacy_preset
    attributes:
      label: Privacy preset
      options:
        - minimal
        - balanced
        - max-context
        - not sure
    validations:
      required: true
  - type: dropdown
    id: ai_include_checkpoint
    attributes:
      label: AI included checkpoint notes?
      options:
        - "yes"
        - "no"
        - not sure
    validations:
      required: true
  - type: dropdown
    id: ai_include_scratchpad
    attributes:
      label: AI included scratchpad content?
      options:
        - "yes"
        - "no"
        - not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (`TaCoS: Copy Diagnostics`)
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or GIF (if user-visible)
      description: Drag-and-drop media links if applicable.
    validations:
      required: false
  - type: input
    id: specs_link
    attributes:
      label: Related `SPECS.md` section (optional)
      placeholder: https://github.com/<org>/<repo>/blob/main/SPECS.md#...
    validations:
      required: false
  - type: input
    id: plans_link
    attributes:
      label: Related `PLANS.md` item (optional)
      placeholder: https://github.com/<org>/<repo>/blob/main/PLANS.md#...
    validations:
      required: false
