name: Feature request
description: Propose a user-facing improvement grounded in TaCoS docs and constraints.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests should map to `SPECS.md` and `PLANS.md`.
        Include trust/privacy/provider implications up front.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: desired_behavior
    attributes:
      label: Desired behavior
      description: What should happen in TaCoS (user-visible flow)?
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Why existing flows/settings are insufficient
    validations:
      required: true
  - type: textarea
    id: trust_privacy
    attributes:
      label: Trust and privacy implications
      description: Any Restricted Mode, retention, redaction, consent, or data-boundary impact.
    validations:
      required: true
  - type: textarea
    id: ai_provider
    attributes:
      label: AI/provider implications
      description: Impact on `local` / `vscode-lm` / `openai` behavior, if any.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete checks that define done.
    validations:
      required: true
  - type: textarea
    id: docs_impact
    attributes:
      label: Docs/spec impact
      description: Which docs/spec sections must be updated.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: input
    id: specs_link
    attributes:
      label: Related `SPECS.md` section
      placeholder: https://github.com/<org>/<repo>/blob/main/SPECS.md#...
    validations:
      required: false
  - type: input
    id: plans_link
    attributes:
      label: Related `PLANS.md` item
      placeholder: https://github.com/<org>/<repo>/blob/main/PLANS.md#...
    validations:
      required: false
