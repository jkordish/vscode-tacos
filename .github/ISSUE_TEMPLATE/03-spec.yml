name: Spec proposal
description: Propose a larger feature/spec slice before implementation.
title: "spec: "
labels:
  - spec
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: Goals
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: User-facing behavior
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Technical shape / architecture notes
      description: Modules/surfaces touched and why.
    validations:
      required: true
  - type: textarea
    id: commands_settings
    attributes:
      label: Commands/settings affected
      description: New or changed `tacos.*` settings and command IDs.
    validations:
      required: true
  - type: textarea
    id: trust_privacy_ai
    attributes:
      label: Trust/privacy/AI impact
      description: Restricted Mode behavior, redaction/consent boundaries, provider impact.
    validations:
      required: true
  - type: textarea
    id: rollout_rollback
    attributes:
      label: Rollout and rollback notes
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks / failure modes
    validations:
      required: true
  - type: textarea
    id: test_plan
    attributes:
      label: Test plan
      description: Unit/integration/manual validation expected.
    validations:
      required: true
  - type: input
    id: specs_target
    attributes:
      label: Target `SPECS.md` section
      placeholder: Existing heading or proposed new section title
    validations:
      required: true
  - type: input
    id: plans_target
    attributes:
      label: Target `PLANS.md` item
      placeholder: Existing item or proposed execution slot
    validations:
      required: true
