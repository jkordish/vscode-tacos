name: "UX feedback: AI opt-in trust"
description: Share trust/safety feedback about AI payload preview and consent flow.
title: "ux(ai-opt-in): "
labels:
  - ux
  - area:privacy
  - area:ai
body:
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: What were you trying to do?
      placeholder: Example: enable AI refinement for one workspace while keeping scratchpad private.
    validations:
      required: true
  - type: textarea
    id: unsafe_feeling
    attributes:
      label: What felt unsafe or confusing?
      placeholder: Which wording, defaults, or prompts reduced trust?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would have felt safer?
      placeholder: Describe the safer behavior or copy you expected.
    validations:
      required: true
  - type: checkboxes
    id: payload_flags
    attributes:
      label: Inclusion flags you observed
      options:
        - label: Checkpoint notes included
        - label: Scratchpad included
        - label: High-risk detected warning shown
  - type: textarea
    id: preview_excerpt
    attributes:
      label: Optional redacted preview excerpt
      description: Only share already-redacted snippets (no raw secrets).
      render: text
    validations:
      required: false
