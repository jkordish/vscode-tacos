name: "Bug: Sanitization"
description: Report sanitizer behavior issues using privacy-safe evidence only.
title: "bug(sanitization): "
labels:
  - bug
  - area:redaction
  - area:privacy
body:
  - type: markdown
    attributes:
      value: |
        Share only sanitized artifacts.
        Do not paste raw secrets, tokens, private keys, cookies, or full local paths.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Expected behavior vs actual sanitizer behavior.
      placeholder: Brief expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: sanitized_preview
    attributes:
      label: Sanitized payload preview (safe)
      description: Paste the redacted preview output or `TaCoS: Test Sanitizer` result.
      render: text
    validations:
      required: true
  - type: textarea
    id: redaction_report
    attributes:
      label: Redaction report summary
      description: Include category counts and high-risk flag only (no raw values).
      placeholder: |
        totalReplacements=...
        highRiskDetected=true|false
        categories:
        - bearer_header: N
        - custom_pattern: N
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: trust_mode
    attributes:
      label: Workspace trust mode
      options:
        - trusted
        - restricted
        - not sure
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Active summary provider
      placeholder: local | vscode-lm | openai
    validations:
      required: false
